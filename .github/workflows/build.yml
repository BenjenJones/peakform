name: Build image

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: version
        run: |
          echo "version=$(grep '^version:' peakform/config.yaml | cut -d'"' -f2)" >> "$GITHUB_OUTPUT"
          echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          # HA pulls the tag matching config.yaml's version.
          tags: |
            ghcr.io/${{ steps.version.outputs.owner }}/peakform:${{ steps.version.outputs.version }}
            ghcr.io/${{ steps.version.outputs.owner }}/peakform:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
